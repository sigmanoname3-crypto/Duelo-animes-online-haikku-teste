<style>
:root{--bg:#0b090a;--panel:#1a1417;--red:#d7141f;--ink:#f1ebe4;--gold:#f2b632;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.tile.sel{border-color:#2aa8ff;box-shadow:0 0 9px #2aa8ff}
.pnl.opp .tile.sel{border-color:#ff4b3a;box-shadow:0 0 9px #ff4b3a}.pnl.opp .tile .bd{background:#ff4b3a}
.tile.cur{outline:2px solid #ffd23a;outline-offset:1px}

#info{font:italic 800 20px Impact,sans-serif;color:var(--gold);min-height:46px}
#info small{display:block;font:11px system-ui;color:var(--ink);opacity:.8;margin-top:3px}
#ostat{font:13px system-ui;opacity:.8;margin:6px 0 0;min-height:16px}
#mt{font-size:46px}

 #jk{width:58px;height:58px;margin:-29px 0 0 -29px}

</style></head><body>
